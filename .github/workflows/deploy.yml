name: Fast Build, Test & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  BACKEND_IMAGE_NAME: fairproctor-backend
  FRONTEND_IMAGE_NAME: fairproctor-frontend

jobs:
  deploy:
    name: Fast Test, Build & Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Backend Unit Tests
      # -----------------------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx "uvicorn[standard]"
          python -m pytest -q tests/

      # -----------------------------------------------------------------------
      # 2. Frontend Build & Tests
      # -----------------------------------------------------------------------
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Test & Build Frontend
        working-directory: frontend
        run: |
          npm ci --prefer-offline
          npm test
          npm run build

      # -----------------------------------------------------------------------
      # 3. AWS & ECR Authentication
      # -----------------------------------------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repositories Exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.BACKEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name ${{ env.BACKEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || true
          aws ecr describe-repositories --repository-names ${{ env.FRONTEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name ${{ env.FRONTEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || true

      # -----------------------------------------------------------------------
      # 4. Ultra-Fast Docker Build & Push
      # -----------------------------------------------------------------------
      - name: Build & Push Backend Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "📦 Building Backend Docker image..."
          docker build -t ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} -t ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:latest .
          echo "🚀 Pushing Backend Docker image to ECR..."
          docker push ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build & Push Frontend Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "📦 Building Frontend Docker image with pre-compiled assets..."
          docker build -f frontend/Dockerfile.prod -t ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} -t ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:latest ./frontend
          echo "🚀 Pushing Frontend Docker image to ECR..."
          docker push ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      # -----------------------------------------------------------------------
      # 5. Direct EC2 Deployment
      # -----------------------------------------------------------------------
      - name: Generate ECR Login Password
        id: ecr-auth
        run: |
          PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Copy Production Compose File to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml'
          target: '~/fairproctor/'

      - name: Deploy & Restart Containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_PASSWORD: ${{ steps.ecr-auth.outputs.password }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,ECR_PASSWORD
          command_timeout: 5m
          script: |
            set -e
            echo "🚀 Launching FairProctor-AI Containers on EC2..."

            sudo systemctl start docker || true

            DOCKER_CMD="docker"
            if ! docker info &> /dev/null; then
              DOCKER_CMD="sudo -E docker"
            fi

            # Authenticate Docker directly with Amazon ECR
            echo "${ECR_PASSWORD}" | $DOCKER_CMD login --username AWS --password-stdin "${ECR_REGISTRY}"

            cd ~/fairproctor
            export ECR_REGISTRY="${ECR_REGISTRY}"
            export IMAGE_TAG="${IMAGE_TAG}"

            echo "📦 Pulling latest production container images..."
            $DOCKER_CMD compose -f docker-compose.prod.yml pull

            echo "🔄 Launching updated services..."
            $DOCKER_CMD compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "🧹 Cleaning up old Docker layers..."
            $DOCKER_CMD image prune -f

            echo "🔍 Verifying container health..."
            sleep 5
            $DOCKER_CMD compose -f docker-compose.prod.yml ps

            echo "✅ FairProctor-AI is live and running on EC2!"
