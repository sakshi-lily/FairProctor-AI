name: Deploy FairProctor to AWS EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  BACKEND_IMAGE_NAME: fairproctor-backend
  FRONTEND_IMAGE_NAME: fairproctor-frontend

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repositories Exist
        run: |
          aws ecr describe-repositories --repository-names ${{ env.BACKEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name ${{ env.BACKEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || true
          aws ecr describe-repositories --repository-names ${{ env.FRONTEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || \
            aws ecr create-repository --repository-name ${{ env.FRONTEND_IMAGE_NAME }} --region ${{ env.AWS_REGION }} 2>/dev/null || true

      - name: Build & Push Backend Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "📦 Building Backend Docker image..."
          docker build -t ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }} -t ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:latest .
          echo "🚀 Pushing Backend Docker image..."
          docker push ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${ECR_REGISTRY}/${{ env.BACKEND_IMAGE_NAME }}:latest

      - name: Build & Push Frontend Container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "📦 Building Frontend Docker image..."
          docker build -t ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }} -t ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:latest ./frontend
          echo "🚀 Pushing Frontend Docker image..."
          docker push ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}
          docker push ${ECR_REGISTRY}/${{ env.FRONTEND_IMAGE_NAME }}:latest

      - name: Generate ECR Login Password
        id: ecr-auth
        run: |
          PASSWORD=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
          echo "::add-mask::$PASSWORD"
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT

      - name: Encode Compose File
        id: compose-encoded
        run: |
          B64=$(base64 -w 0 docker-compose.prod.yml 2>/dev/null || base64 docker-compose.prod.yml | tr -d '\r\n')
          echo "b64=$B64" >> $GITHUB_OUTPUT

      - name: Deploy Containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_PASSWORD: ${{ steps.ecr-auth.outputs.password }}
          COMPOSE_B64: ${{ steps.compose-encoded.outputs.b64 }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,IMAGE_TAG,ECR_PASSWORD,COMPOSE_B64
          command_timeout: 5m
          script: |
            set -e
            echo "🚀 Launching FairProctor-AI Containers on EC2..."

            mkdir -p ~/fairproctor
            echo "${COMPOSE_B64}" | base64 -d > ~/fairproctor/docker-compose.prod.yml


            sudo systemctl start docker || true

            DOCKER_CMD="docker"
            if ! docker info &> /dev/null; then
              DOCKER_CMD="sudo -E docker"
            fi

            # Ensure Docker Compose plugin or binary is available
            if ! $DOCKER_CMD compose version &> /dev/null; then
              echo "📦 Installing Docker Compose standalone binary..."
              sudo curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              sudo ln -sf /usr/local/bin/docker-compose /usr/local/lib/docker/cli-plugins/docker-compose
            fi

            # Authenticate Docker directly with Amazon ECR
            echo "${ECR_PASSWORD}" | $DOCKER_CMD login --username AWS --password-stdin "${ECR_REGISTRY}"

            sudo chown -R $USER:$USER ~/fairproctor || true
            sudo chmod -R u+rw ~/fairproctor || true
            sudo ufw allow 80/tcp || true
            sudo ufw allow 443/tcp || true
            sudo ufw allow 8000/tcp || true
            sudo ufw --force disable || true

            cd ~/fairproctor

            echo "ECR_REGISTRY=${ECR_REGISTRY}" > ~/fairproctor/.env || true
            echo "IMAGE_TAG=${IMAGE_TAG}" >> ~/fairproctor/.env || true

            export ECR_REGISTRY="${ECR_REGISTRY}"
            export IMAGE_TAG="${IMAGE_TAG}"

            echo "🛑 Removing any old or crashing containers..."
            $DOCKER_CMD rm -f fairproctor-backend fairproctor-frontend 2>/dev/null || true
            $DOCKER_CMD compose -f docker-compose.prod.yml down --remove-orphans || true

            echo "🧹 Reclaiming disk space before pull..."
            $DOCKER_CMD system prune -af --volumes || true
            sudo journalctl --vacuum-size=50M || true
            sudo apt-get clean 2>/dev/null || true
            df -h /

            echo "📦 Pulling latest production container images..."
            $DOCKER_CMD compose -f docker-compose.prod.yml pull

            echo "🔄 Launching updated services..."
            $DOCKER_CMD compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

            echo "🧹 Cleaning up old Docker layers..."
            $DOCKER_CMD image prune -f || true

            # Inspection & Diagnostics (non-fatal)
            set +e
            echo "🔍 Verifying container health..."
            sleep 6
            $DOCKER_CMD compose -f docker-compose.prod.yml ps

            echo "🌐 Inspecting Listening Ports on Server:"
            sudo ss -tulpn | grep -E ':(80|443|8000)'

            echo "🌐 Testing Local HTTP Response on Server:"
            curl -I http://127.0.0.1:80
            curl -k -I https://127.0.0.1:443

            echo "✅ FairProctor-AI is live and running on EC2 with HTTPS!"


