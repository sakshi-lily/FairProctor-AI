services:
  backend:
    image: ${ECR_REGISTRY}/fairproctor-backend:${IMAGE_TAG:-latest}
    container_name: fairproctor-backend
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - fairproctor-net

  frontend:
    image: ${ECR_REGISTRY}/fairproctor-frontend:${IMAGE_TAG:-latest}
    container_name: fairproctor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - fairproctor-net

networks:
  fairproctor-net:
    name: fairproctor-net
    driver: bridge
